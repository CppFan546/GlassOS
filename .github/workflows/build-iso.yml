name: Build GlassOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out GlassOS
        uses: actions/checkout@v4
      - name: Install Debian live-build tools and archive keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - name: Configure live system
        run: |
          chmod +x auto/config config/hooks/live/*.hook.chroot
          sudo lb config
      - name: Build GlassOS live ISO
        run: sudo lb build
      - name: Find generated ISO
        id: iso
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          sha256sum "$ISO" | tee SHA256SUMS.txt
      - name: Upload GlassOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: GlassOS-live-amd64
          path: |
            ${{ steps.iso.outputs.path }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
